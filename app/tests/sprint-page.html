<!DOCTYPE html>
<!--
  tests/sprint-page.html — TEST ONLY. Stands in for a published sprint page in
  Confluence: it takes the page that Publish created in the fake Confluence
  (mock-env.js), prints the same meta tags Confluence prints, and runs the
  page's HTML macro body exactly as Publish wrote it. That body loads
  scp-view.css and scp-view.js from the parent page, and the viewer reads the
  page's scp-snapshot.json, so this shows what the team sees.

  Open with ?page=<id>; without it, the most recently published sprint page.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Published sprint page (fake Confluence)</title>
  <meta name="ajs-context-path" content="">
  <meta name="ajs-page-id" content="">
  <script src="mock-env.js"></script>
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; color: #16202e; }
    .crumbs { padding: 12px 32px; font-size: 13px; color: #5a6474; background: #fff; border-bottom: 1px solid #e3e7ee; }
    main { padding: 28px 152px; }
    h1 { margin: 0 0 6px; font-size: 32px; }
    .none { color: #5a6474; }
    @media (max-width: 900px) { main { padding: 24px; } }
  </style>
</head>
<body>
  <div class="crumbs" id="crumbs"></div>
  <main>
    <h1 id="title" data-test="page-title"></h1>
    <div id="body"></div>
  </main>
  <script>
    (function () {
      var pages = {};
      try { pages = JSON.parse(localStorage.getItem('scp-mock-pages') || '{}'); } catch (e) { pages = {}; }
      var id = new URLSearchParams(location.search).get('page');
      if (!id) {
        // The newest page whose body is the planner's HTML macro.
        Object.keys(pages).forEach(function (k) {
          if (/scp-view/.test(pages[k].body || '') && (!id || Number(k) > Number(id))) { id = k; }
        });
      }
      var page = pages[id];
      if (!page) {
        document.getElementById('body').innerHTML = '<p class="none">No sprint page has been published yet. Click Publish to team on the planning page first.</p>';
        return;
      }
      document.querySelector('meta[name="ajs-page-id"]').setAttribute('content', id);
      document.title = page.title;
      document.getElementById('title').textContent = page.title;
      var trail = [];
      var cur = page.parentId;
      while (cur && pages[cur]) { trail.unshift(pages[cur].title); cur = pages[cur].parentId; }
      document.getElementById('crumbs').textContent = trail.concat([page.title]).join('  ›  ');

      /* The HTML macro: take the CDATA body Publish wrote and run its script, as Confluence does. */
      var m = /<!\[CDATA\[([\s\S]*?)\]\]>/.exec(page.body || '');
      var host = document.getElementById('body');
      host.innerHTML = m ? m[1] : (page.body || '');
      host.querySelectorAll('script').forEach(function (old) {
        var s = document.createElement('script');
        s.textContent = old.textContent;
        old.parentNode.replaceChild(s, old);
      });
    }());
  </script>
</body>
</html>
